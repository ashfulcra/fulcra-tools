[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fulcra-netflix-skill"
version = "0.1.0"
description = "Netflix history parser and installed native Watched Event importer."
requires-python = ">=3.11"
dependencies = ["fulcra-common", "fulcra-collect", "fulcra-media-helpers"]

[project.scripts]
fulcra-netflix = "fulcra_netflix.loader:main"

[tool.uv.sources]
fulcra-common = { workspace = true }
fulcra-collect = { workspace = true }
fulcra-media-helpers = { workspace = true }

[project.optional-dependencies]
dev = [
    # pytest<8 to stay co-resolvable with fulcra-attention[dev] (which
    # inherits fulcra-api's pytest<8 pin) in the workspace-wide solve.
    "pytest>=7.4,<8",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["fulcra_netflix"]

# Ride the skill folder INTO the wheel as package data, following the
# monorepo convention (collect's _bundled/, fulcra-coord's _data/): a
# non-editable install has no workspace tree next to site-packages, so
# loader.py falls back to this copy when the source path is absent.
[tool.hatch.build.targets.wheel.force-include]
"skills/fulcra-netflix" = "fulcra_netflix/_bundled/skills/fulcra-netflix"
