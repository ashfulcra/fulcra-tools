[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fulcra-todoist"
version = "0.1.0"
description = "Selected Todoist project task synchronization for Fulcra Collect."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fulcra-task-sync", "fulcra-collect"]

[project.entry-points."fulcra_collect.plugins"]
todoist = "fulcra_todoist.collect_plugin:PLUGIN"

[project.optional-dependencies]
dev = ["pytest>=7.4,<8", "ruff>=0.5"]

[tool.uv.sources]
fulcra-task-sync = { workspace = true }
fulcra-collect = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["fulcra_todoist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
