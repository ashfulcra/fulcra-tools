[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fulcra-apple-notes"
version = "0.1.0"
description = "Sync Apple Notes into a Fulcra vault as markdown, with attachments."
requires-python = ">=3.11"
dependencies = [
    "fulcra-collect",
]

[project.entry-points."fulcra_collect.plugins"]
apple-notes = "fulcra_apple_notes.collect_plugin:PLUGIN"

[tool.uv.sources]
fulcra-collect = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
# "." so the package imports without an install; "tests" so test modules
# can import the protobuf builders out of conftest.
pythonpath = [".", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["fulcra_apple_notes"]
