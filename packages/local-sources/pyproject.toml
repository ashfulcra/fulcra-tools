[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fulcra-local-sources"
version = "0.1.0"
description = "Collect selected local folders and meeting transcript exports into Fulcra Files."
requires-python = ">=3.11"
dependencies = [
    "fulcra-collect",
    "fulcra-common",
]

[project.entry-points."fulcra_collect.plugins"]
local-folders = "fulcra_local_sources.collect_plugins:LOCAL_FOLDERS_PLUGIN"
meeting-transcripts = "fulcra_local_sources.collect_plugins:MEETING_TRANSCRIPTS_PLUGIN"

[tool.uv.sources]
fulcra-collect = { workspace = true }
fulcra-common = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["fulcra_local_sources"]
