[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fulcra-notion"
version = "0.1.0"
description = "Copy explicitly selected Notion pages into Fulcra Files."
requires-python = ">=3.11"
dependencies = ["fulcra-collect", "fulcra-local-sources", "httpx>=0.27"]

[project.entry-points."fulcra_collect.plugins"]
notion-pages = "fulcra_notion.collect_plugin:PLUGIN"

[tool.uv.sources]
fulcra-collect = { workspace = true }
fulcra-local-sources = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=7.4,<8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["fulcra_notion"]
