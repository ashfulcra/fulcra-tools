          def check_workflow(expected,actual):
              assert isinstance(expected,str) and re.fullmatch('[0-9a-f]{64}',expected), 'Missing exact externally owned workflow hash'
              assert sha(actual)==expected, 'Workflow differs from independently declared expectation'


          def _private_frame_write(fd,value):
              s=stages_module();raw=s.encode(value)
              assert len(raw)<=s.MAX_CONTEXT_METADATA
              frame=str(len(raw)).encode()+b'\n'+raw+b'\n'
              # Separate startup framing retains metadata's 8MiB bound; stage completion stays32KiB.
              import selectors,time
              s._require_pipe(fd,writing=True);deadline=time.monotonic()+5;position=0
              with selectors.DefaultSelector() as selector:
                  os.set_blocking(fd,False);selector.register(fd,selectors.EVENT_WRITE)
                  while position<len(frame):
                      remaining=deadline-time.monotonic();assert remaining>0
                      if selector.select(remaining):position+=os.write(fd,frame[position:position+65536])


          def _private_frame_read(fd,timeout=60):
              s=stages_module();import selectors,time
              s._require_pipe(fd,writing=False);deadline=time.monotonic()+timeout;data=bytearray()
              with selectors.DefaultSelector() as selector:
                  os.set_blocking(fd,False);selector.register(fd,selectors.EVENT_READ)
                  while True:
                      remaining=deadline-time.monotonic();assert remaining>0
                      if not selector.select(remaining):continue
                      chunk=os.read(fd,min(65536,s.MAX_CONTEXT_METADATA+16-len(data)+1))
                      if not chunk:break
                      data.extend(chunk);assert len(data)<=s.MAX_CONTEXT_METADATA+16
              prefix,separator,rest=data.partition(b'\n');assert separator and prefix.isdigit() and len(prefix)<=7
              count=int(prefix);assert 0<count<=s.MAX_CONTEXT_METADATA and prefix==str(count).encode()
              assert len(rest)==count+1 and rest[-1:]==b'\n'
              result=s._json(rest[:-1]);assert s.encode(result)==rest[:-1]
              return result


          def _materialize_policy_inputs(private):
              """Only source-reviewed immutable origin files; never inspect candidate app."""
              s=stages_module();spec=REVIEWED_POLICY_INPUTS
              validate_policy_manifest(spec)
              assert isinstance(spec['files'],list) and len(spec['files'])<=256
              for record in spec['files']:
                  assert set(record)=={'name','bytes','sha256','hex'}
                  assert s.core._safe_path(record['name']) and '/' not in record['name']
                  raw=bytes.fromhex(record['hex'])
                  assert len(raw)==record['bytes']<=s.MAX_RECEIPT and sha(raw)==record['sha256']
                  s._exclusive(private/record['name'],raw)
              # Relative templates are reviewed source data. Only these three anchors resolve.
              def expand(value):
                  if isinstance(value,str):
                      for prefix,base in (('$WORKSPACE/',ROOT),('$PRIVATE/',private),('$BRIEFCASE/',Path(os.environ['BRIEFCASE_HOME']))):
                          if value.startswith(prefix):
                              suffix=value[len(prefix):];assert s.core._safe_path(suffix)
                              return str(base/suffix)
                      assert not value.startswith('$')
                      return value
                  if isinstance(value,list):return [expand(v) for v in value]
                  if isinstance(value,dict):return {k:expand(v) for k,v in value.items()}
                  assert value is None or type(value) in (bool,int)
                  return value
              return expand(spec['recipe'])


          def provision_request(private):
              s=stages_module();require_finalized();check_live_product()
              expected=os.environ.get('COLLECT_EXPECTED_WORKFLOW_SHA256')
              check_workflow(expected,(ROOT/'.github/workflows/macos.yml').read_bytes())
              recipe=_materialize_policy_inputs(private)
              # The interpreter and Briefcase executable are pinned from trusted provisioning,
              # before CREATE, then retained; later observations cannot replace these pins.
              python=Path(sys.executable).resolve(strict=True)
              metadata=_qa_command(('/usr/bin/env','uvx','--with','pip==26.2.2','--from','briefcase==0.3.25','python','-I','-B','-c',"import pathlib,sysconfig,briefcase.platforms.macOS;print(pathlib.Path(sysconfig.get_path('scripts'))/'briefcase');print(pathlib.Path(briefcase.platforms.macOS.__file__))"),'provisioning-paths.txt',timeout=120)
              lines=metadata.output.decode().splitlines();assert len(lines)==2 and metadata.stderr==b''
              briefcase=Path(lines[0]);macos_source=Path(lines[1]);assert briefcase.is_absolute() and macos_source.is_absolute()
              assert not briefcase.is_symlink() and not python.is_symlink()
              assert sha(s.read(macos_source,128*1024*1024))==s.BRIEFCASE_SOURCE_SHA256
              recipe.update(briefcase_source=str(macos_source),briefcase_source_sha256=s.BRIEFCASE_SOURCE_SHA256,
                  compiler_baseline={'schema':2,'profile':'cloud-xcode16.4-arm64-v1','source':str(ROOT/'packages/menubar/scripts/cli_launcher.c')},
                  compiler_producer={'python':{'path':str(python),'sha256':s._tool_identity(str(python))},'workflow':{'path':str(ROOT/'.github/workflows/macos.yml'),'sha256':expected},
                      'environment':{k:os.environ[k] for k in ('HOME','TMPDIR','LANG','LC_ALL') if k in os.environ}|{'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','PYTHONDONTWRITEBYTECODE':'1'}},
                  build_argv=[str(briefcase),'build','macOS'],operation_cwd='packages/menubar')
              assert 'HOME' in recipe['compiler_producer']['environment'] and 'TMPDIR' in recipe['compiler_producer']['environment']
              tools=[{'path':p,'sha256':h} for p,_,h in s.compiler.WRAPPERS]+[{'path':str(python),'sha256':s._tool_identity(str(python))},{'path':str(briefcase),'sha256':s._tool_identity(str(briefcase))}]
              assert all(s._tool_identity(t['path'])==t['sha256'] for t in tools)
              # Actual sizes, including the real Python and Briefcase entries, must fit.
              from types import SimpleNamespace
              s.compiler.plan_compiler_reads(SimpleNamespace(invocation=SimpleNamespace(tools=tuple(s.ToolIdentity(**t) for t in tools))),s.compiler.CLOUD)
              catalog=s._json(s.read(s.core._CATALOG_PATH));archives={}
              caches=[ROOT/'wheelhouse',Path(os.environ['BRIEFCASE_HOME'])]
              for record in catalog['archives']:
                  matches=[p for cache in caches for p in cache.rglob(record['name']) if p.is_file() and not p.is_symlink()]
                  assert len(matches)==1, ('Required pre-CREATE public archive missing/ambiguous',record['name'])
                  raw=s.read(matches[0],s.core.MAX_ARCHIVE_BYTES)
                  assert len(raw)==record['bytes'] and sha(raw)==record['sha256']
                  archives[record['name']]=str(matches[0])
              recipe_raw=s.encode(recipe);s._exclusive(private/'recipe.json',recipe_raw)
              request={'workspace':str(ROOT),'app':str(APP),'source_files':[str(ROOT/row[0]) for row in REVIEWED_PRODUCT_ROWS]+[str(ROOT/'.github/workflows/macos.yml')],
                  'lock':str(ROOT/'uv.lock'),'recipe':str(private/'recipe.json'),'recipe_sha256':sha(recipe_raw),'archives':archives,
                  'catalog_sha256':sha(s.read(s.core._CATALOG_PATH)),'architecture':'arm64','tools':tools,'markers':list(s.required_markers())+[str(ROOT)]}
              validate_request(request)
              s._exclusive(private/'request.json',s.encode(request))
              return request,recipe_raw


          def startup_message(e,request,recipe_raw):
              s=stages_module()
              return {'schema':1,'request':request,'request_sha256':sha(s.encode(request)),'recipe':recipe_raw.decode(),
                  'recipe_sha256':sha(recipe_raw),'context':s.context_json(e)}


          def validate_startup_payload(message):
              s=stages_module()
              assert set(message)=={'schema','request','request_sha256','recipe','recipe_sha256','context'} and type(message['schema']) is int and message['schema']==1
              assert sha(s.encode(message['request']))==message['request_sha256']
              assert isinstance(message['recipe'],str) and sha(message['recipe'].encode())==message['recipe_sha256']==message['request']['recipe_sha256']
              return message['request']


          def validate_startup(message):
              s=stages_module();validate_startup_payload(message);check_live_product()
              recipe=validate_request(message['request']);assert s.encode(recipe)==message['recipe'].encode()
              e=s.context_from_json(message['context']);assert e.head==s.Head()
              assert e.invocation.recipe_sha256==message['recipe_sha256'] and e.invocation.workspace==str(ROOT) and e.invocation.app==str(APP)
              assert e.invocation.tools==tuple(s.ToolIdentity(**t) for t in message['request']['tools'])
              assert e.source_files==tuple(Path(p) for p in message['request']['source_files'])
              assert s._source_digest(e.source_files)==e.invocation.source_sha256
              return e


          def wait_startup():
              s=stages_module();e=s.expected_from_environment()
              ack=_private_frame_read(int(os.environ['COLLECT_STARTUP_ACK_FD']),timeout=60)
              assert ack=={'schema':1,'nonce':e.invocation.nonce,'invocation_sha256':sha(s.encode(s.asdict(e.invocation))),'stage':'EMPTY'}




          def validate_policy_manifest(spec):
              s=stages_module()
              assert isinstance(spec,dict) and set(spec)=={'recipe','files','archives'}
              assert len(s.encode(spec))<=s.MAX_CONTEXT_METADATA
              recipe=spec['recipe']
              assert isinstance(recipe,dict) and set(recipe)=={'policy_schema','mode','config','config_sha256','template','template_sha256','briefcase_entitlements','targets','sign_targets','bundle_info_inputs','signature_resources','sign_argv','entitlements_inputs'}
              assert type(recipe['policy_schema']) is int and recipe['policy_schema']==1 and recipe['mode']=='adhoc'
              assert recipe['config']=='$WORKSPACE/packages/menubar/pyproject.toml'
              assert recipe['template_sha256']==s.TEMPLATE_SHA256
              assert isinstance(spec['files'],list) and len(spec['files'])<=256
              names=set()
              for record in spec['files']:
                  assert isinstance(record,dict) and set(record)=={'name','bytes','sha256','hex'}
                  assert s.core._safe_path(record['name']) and '/' not in record['name'] and record['name'] not in names
                  names.add(record['name']);raw=bytes.fromhex(record['hex'])
                  assert type(record['bytes']) is int and len(raw)==record['bytes']<=s.MAX_RECEIPT and sha(raw)==record['sha256']
              assert isinstance(spec['archives'],list) and len(spec['archives'])<=s.core.MAX_ARCHIVES
              assert len({record['name'] for record in spec['archives']})==len(spec['archives'])
              for record in spec['archives']:
                  assert set(record)=={'name','cache_path','url','bytes','sha256'}
                  assert s.core._safe_path(record['cache_path']) and Path(record['cache_path']).name==record['name']
                  assert record['url'].startswith('https://') and type(record['bytes']) is int and 0<record['bytes']<=s.core.MAX_ARCHIVE_BYTES
                  assert re.fullmatch('[0-9a-f]{64}',record['sha256'])
              for name in ('targets','sign_targets'):
                  rules=recipe[name];assert isinstance(rules,list) and 0<len(rules)<=s.core.MAX_APP_ENTRIES
                  assert len({r['path'] for r in rules})==len(rules)
                  for rule in rules:
                      assert set(rule)=={'path','identifier','role','flags','team'}
                      assert rule['path']=='.' or s.core._safe_path(rule['path'])
                      assert '*' not in rule['path'] and rule['team']=='not set' and type(rule['flags']) is int
                      assert rule['role'] in ('app','briefcase','compiler','adhoc-absent')
              # Full source derivation remains the authority after materialization.


          def prefetch_profile_archives():
              import urllib.request,time
              s=stages_module();validate_policy_manifest(REVIEWED_POLICY_INPUTS)
              total=0;deadline=time.monotonic()+180
              for record in REVIEWED_POLICY_INPUTS['archives']:
                  target=Path(os.environ['BRIEFCASE_HOME'])/record['cache_path']
                  assert target.is_relative_to(Path(os.environ['BRIEFCASE_HOME']))
                  if target.exists():
                      raw=s.read(target,s.core.MAX_ARCHIVE_BYTES)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      chunks=[];count=0
                      with urllib.request.urlopen(record['url'],timeout=30) as response:
                          while True:
                              assert time.monotonic()<deadline
                              chunk=response.read(min(1048576,record['bytes']-count+1))
                              if not chunk:break
                              count+=len(chunk);assert count<=record['bytes'];chunks.append(chunk)
                      raw=b''.join(chunks)
                      assert len(raw)==record['bytes'] and sha(raw)==record['sha256']
                      fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
                      with os.fdopen(fd,'wb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
                  total+=len(raw);assert total<=s.core.MAX_ARCHIVE_TOTAL
                  assert len(raw)==record['bytes'] and sha(raw)==record['sha256']

          def main():
              if sys.argv[1] == 'runtime-privacy-diagnostic':
                  raise SystemExit(runtime_privacy_diagnostic())
              if sys.argv[1] == 'prepare':
                  require_finalized()
                  check_workflow(os.environ.get('COLLECT_EXPECTED_WORKFLOW_SHA256'),(ROOT/'.github/workflows/macos.yml').read_bytes())
                  assert git('status','--porcelain=v1','--untracked-files=all')==b''
                  check_product(REVIEWED_PRODUCT_ROWS,product_rows())
                  lock=locked();assert lock['fulcra-api']['version']=='0.1.56'
                  (OUT/'runtime-constraints.txt').write_text(constraint_text(lock))
                  (OUT/'build-constraints.txt').write_text('hatchling==1.33.0\n')
                  p=ROOT/'packages/menubar/scripts/build_macos_app.sh';raw=p.read_bytes();adapted=adapt_build(raw)
                  (OUT/'build-adapter.diff').write_text(''.join(difflib.unified_diff(raw.decode().splitlines(True),adapted.decode().splitlines(True),fromfile=str(p),tofile=str(p))))
                  p.write_bytes(adapted)
                  save('source-tree.json',{'head':git('rev-parse','HEAD').decode().strip(),'product_manifest_sha256':REVIEWED_PRODUCT_MANIFEST_SHA256,'build_source_sha256':sha(raw),'adapted_build_sha256':sha(adapted)})
              elif sys.argv[1] == 'template-check':
                  save('template-checkout-provenance.json',verify_selected_template())
              elif sys.argv[1] == 'prefetch':
                  lock = locked()
                  before = {p.name:sha(p.read_bytes()) for p in Path('wheelhouse').glob('*.whl')}
                  save('locally-built-wheel-hashes.json', before)
                  requirements = tomllib.loads(Path('packages/menubar/pyproject.toml').read_text())['tool']['briefcase']['app']['fulcra-menubar']['requires']
                  subprocess.run(['uvx','--from','pip==26.2.2','pip','download','--only-binary=:all:','--find-links',str(ROOT/'wheelhouse'),'--dest',str(ROOT/'wheelhouse'),*requirements],check=True)
                  for name,digest in before.items(): assert sha((Path('wheelhouse')/name).read_bytes())==digest, ('LOCAL_WHEEL_REPLACED',name)
                  approved = {a['hash'].split(':',1)[1] for p in lock.values() for a in p.get('wheels',[])}
                  fetched=[]
                  for wheel in Path('wheelhouse').glob('*.whl'):
                      if wheel.name not in before:
                          digest=sha(wheel.read_bytes())
                          assert digest in approved, ('UNTESTED_REGISTRY_WHEEL',wheel.name)
                          fetched.append({'filename':wheel.name,'sha256':digest})
                  save('registry-wheel-lock-hashes.json',fetched)
                  save('template-precreate-provenance.json',verify_selected_template())
                  prefetch_profile_archives()
              elif sys.argv[1] == 'wheels':
                  lock = locked()
                  found = []
                  for w in sorted(Path('wheelhouse').glob('*.whl')):
                      with zipfile.ZipFile(w) as z:
                          name = next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))
                          text = z.read(name).decode()
                          dist = re.search(r'^Name: (.+)$',text,re.M)[1]
                          version = re.search(r'^Version: (.+)$',text,re.M)[1]
                          assert norm(dist) in lock and lock[norm(dist)]['version'] == version, (dist,version)
                          found.append({'wheel':w.name,'sha256':sha(w.read_bytes()),'name':dist,'version':version})
                  assert found, 'No built wheels'
                  save('workspace-and-sdist-wheels.json',found)
              elif sys.argv[1] == 'presign':
                  e=stages_module().expected_from_environment()
                  check_raw_bundle(e.policy.aliases)
                  bind_selected_inputs()
                  save('presign-manifest.json',snapshot_signing(e.policy.aliases))
              elif sys.argv[1] == 'bundle':
                  e=stages_module().expected_from_environment()
                  check_signed_bundle(e.policy.aliases)
              elif sys.argv[1] == 'privacy':
                  s=stages_module();e=s.expected_from_environment();s.load_receipt(e,s.current_ref(e))
                  save('privacy.json',{'status':'COMPLETE','application_acceptance':False,'signed_acceptance':False})
              elif sys.argv[1] == 'trusted-start':trusted_start()
              elif sys.argv[1] == 'wait-startup':wait_startup()
              elif sys.argv[1] == 'dispatch-compiler':dispatch_compiler()
              elif sys.argv[1] == 'finish':finish()
              elif sys.argv[1] == 'qualify':raise SystemExit(qualify())
              else: raise SystemExit('Unknown task')

          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/assembly-qa.py" prepare
      - name: Sync tested lock and record build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'failure=("$?" "${PIPESTATUS[@]}"); printf "POST_SYNC_FAIL rc=%s command=%s pipeline_rcs=%s\n" "${failure[0]}" "$BASH_COMMAND" "${failure[*]:1}" >&2; exit "${failure[0]}"' ERR
          uv sync --frozen --all-packages --all-extras --no-editable 2>&1 | tee "$RUNNER_TEMP/assembly-evidence/sync.log"
          printf '%s\n' 'POST_SYNC_START tool metadata'
          uvx --with pip==26.2.2 --from briefcase==0.3.25 python -c 'import importlib.metadata as m,json; print(json.dumps(sorted((d.metadata["Name"],d.version) for d in m.distributions())))' | tee "$RUNNER_TEMP/assembly-evidence/briefcase-tool-distributions.json"
          printf '%s\n' 'POST_SYNC_OK tool metadata rc=0' 'POST_SYNC_START create help'
          uvx --with pip==26.2.2 --from briefcase==0.3.25 briefcase create macOS --help 2>&1 | tee "$RUNNER_TEMP/assembly-evidence/briefcase-create-help.txt"
          printf '%s\n' 'POST_SYNC_OK create help rc=0' 'POST_SYNC_START config option gate'
          grep -q -- --config "$RUNNER_TEMP/assembly-evidence/briefcase-create-help.txt"
          printf '%s\n' 'POST_SYNC_OK config option gate rc=0'
      - name: Materialize immutable official template
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          TEMPLATE_COMMIT=10d36c8512e92d3ee4b3be2579a47300ac8f844d
          TEMPLATE_DIR="$BRIEFCASE_HOME/qa-template-$TEMPLATE_COMMIT"
          test ! -e "$TEMPLATE_DIR" && test ! -L "$TEMPLATE_DIR"
          mkdir "$TEMPLATE_DIR"
          {
            git -c init.templateDir= -c core.hooksPath=/dev/null init "$TEMPLATE_DIR"
            git -C "$TEMPLATE_DIR" remote add origin https://github.com/beeware/briefcase-macOS-app-template.git
            git -c credential.helper= -c core.hooksPath=/dev/null -C "$TEMPLATE_DIR" fetch --depth=1 --no-tags origin "$TEMPLATE_COMMIT"
            git -c core.hooksPath=/dev/null -c core.autocrlf=false -C "$TEMPLATE_DIR" checkout --detach "$TEMPLATE_COMMIT"
            git -C "$TEMPLATE_DIR" rev-parse HEAD
            python3 "$RUNNER_TEMP/assembly-qa.py" template-check
            cat "$RUNNER_TEMP/assembly-evidence/template-checkout-provenance.json"
          } 2>&1 | tee "$RUNNER_TEMP/assembly-evidence/template-materialization.log"
      - name: Canonical build with recorded CI-only tool substitutions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 "$RUNNER_TEMP/assembly-qa.py" qualify 2>&1 | tee "$RUNNER_TEMP/assembly-evidence/build.log"
          failure=("$?" "${PIPESTATUS[@]}")
          set -e
          if (( failure[0] != 0 )); then
            printf 'BUILD_FAILED rc=%s build_rc=%s tee_rc=%s\n' "${failure[0]}" "${failure[1]}" "${failure[2]}"
            printf '%s\n' 'RUNTIME_PRIVACY_DIAGNOSTIC_START acceptance=false'
            umask 077
            set +e
            python3 "$RUNNER_TEMP/assembly-qa.py" runtime-privacy-diagnostic
            diagnostic_rc=$?
            set -e
            printf 'RUNTIME_PRIVACY_DIAGNOSTIC_END rc=%s acceptance=false\n' "$diagnostic_rc"
            exit "${failure[0]}"
          fi
          python3 "$RUNNER_TEMP/assembly-qa.py" wheels
      - name: Stage bounded nondistributable output
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/packages/menubar/build/fulcra-menubar/macos/app/Fulcra Collect.app"
          E="$RUNNER_TEMP/assembly-evidence"
          cp "$RUNNER_TEMP/assembly-qa.py" "$E/assembly-qa.py"
          cp .github/workflows/macos.yml "$E/workflow.yml"
          printf '%s\n' 'ADHOC QA ONLY. NOT NOTARIZED. NOT FOR DISTRIBUTION. No native/provider/history/install acceptance.' > "$E/ADHOC-QA-NOT-NOTARIZED.txt"
          python3 - <<'PY'
          import json,os,pathlib
          record=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'assembly-evidence/qualification.json').read_text())
          assert record['status']=='COMPLETE' and record['signed_check'] is True
          PY
          # Metadata outside the app records source/tool/recipe and final signed bytes.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$E/ADHOC-QA-NOT-NOTARIZED.zip"
          shasum -a 256 "$E/ADHOC-QA-NOT-NOTARIZED.zip" > "$E/ZIP-SHA256.txt"
          python3 - <<'PY'
          import os,pathlib
          e=pathlib.Path(os.environ['RUNNER_TEMP'])/'assembly-evidence'
          assert sum(p.stat().st_size for p in e.rglob('*') if p.is_file()) <= 1024**3, 'Artifact exceeds 1 GiB; no upload'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ADHOC-QA-NOT-NOTARIZED-${{ github.sha }}
          path: ${{ runner.temp }}/assembly-evidence/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
