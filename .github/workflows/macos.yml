ple.json', '100644', '88dbe0de9a0c8137db76e05c2922f2cf28ae0409'], ['tools/answers-bridge/answers_bridge.py', '100755', '9527a9f8db581c26d61959cb59461d6995b29e6a'], ['tools/answers-bridge/test_answers_bridge.py', '100644', '2d629cf7d7339ceb0d086708ffe8e458fcf11eaa'], ['tools/answers-bridge/test_configuration.py', '100644', 'bd3b0ad7e2db06c919d55e3e38af12a6ea44c58c'], ['uv.lock', '100644', '5f849fed2d2c218d7222be376ce338c32e2b9cb1']]
          REVIEWED_BUILD_SHA256 = '2a5c904c0b39f0f2e024bb2ef2c34d69a4e09b822e929893af7b305a92d54f10'
          REVIEWED_ADAPTED_BUILD_SHA256 = '37849879b223495f4b67ca78ff125e2478250c925fa4aff87068fc67ec00c4e0'


          def stages_module():
              scripts=str(ROOT/'packages/menubar/scripts')
              if scripts not in sys.path:sys.path.insert(0,scripts)
              import bundle_provenance_stages
              return bundle_provenance_stages


          def require_finalized():
              assert isinstance(REVIEWED_PRODUCT_MANIFEST_SHA256,str) and re.fullmatch('[0-9a-f]{64}',REVIEWED_PRODUCT_MANIFEST_SHA256), 'SOURCE_ONLY: reviewed public product manifest not finalized'
              assert isinstance(REVIEWED_PRODUCT_ROWS,list) and REVIEWED_PRODUCT_ROWS, 'SOURCE_ONLY: exact reviewed tree missing'
              assert isinstance(REVIEWED_POLICY_INPUTS,dict), 'SOURCE_ONLY: reviewed source policy-input manifest missing'
              assert sha(json.dumps(REVIEWED_PRODUCT_ROWS,ensure_ascii=True,separators=(',',':')).encode()+b'\n')==REVIEWED_PRODUCT_MANIFEST_SHA256


          def check_product(expected,actual):
              assert expected==actual, 'Reviewed product path/mode/blob mismatch'
              assert len({row[0] for row in actual})==len(actual)
              assert all(len(row)==3 and row[1] in ('100644','100755') and re.fullmatch('[0-9a-f]{40}',row[2]) for row in actual)


          def product_rows():
              rows=[]
              for item in git('ls-tree','-r','-z','HEAD').split(b'\0'):
                  if not item:continue
                  meta,path=item.split(b'\t');mode,kind,blob=meta.split()
                  assert kind==b'blob'
                  if path!=b'.github/workflows/macos.yml':rows.append([path.decode(),mode.decode(),blob.decode()])
              return sorted(rows)


          def check_live_product():
              import stat
              s=stages_module();check_product(REVIEWED_PRODUCT_ROWS,product_rows())
              total=0
              for name,mode,blob in REVIEWED_PRODUCT_ROWS:
                  path=ROOT/name;info=path.stat(follow_symlinks=False)
                  assert stat.S_ISREG(info.st_mode) and stat.S_IMODE(info.st_mode)==(0o755 if mode=='100755' else 0o644)
                  raw=s.read(path,s.core.MAX_FILE_BYTES);total+=len(raw);assert total<=s.core.MAX_TOTAL_BYTES
                  if name=='packages/menubar/scripts/build_macos_app.sh':assert sha(raw)==REVIEWED_ADAPTED_BUILD_SHA256
                  else:assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob, ('Source changed before CREATE',name)
              check_workflow(os.environ.get('COLLECT_EXPECTED_WORKFLOW_SHA256'),(ROOT/'.github/workflows/macos.yml').read_bytes())


          def adapt_build(raw):
              assert sha(raw)==REVIEWED_BUILD_SHA256, 'Unreviewed build entry'
              text=raw.decode()
              replacements={
                  'cd "$REPO/packages/menubar"':'python3 "$RUNNER_TEMP/assembly-qa.py" prefetch\ncd "$REPO/packages/menubar"',
                  'uvx pip wheel "rumps>=0.4" sgmllib3k':'uvx --from pip==26.2.2 pip wheel "rumps==0.4.0" "sgmllib3k==1.0.0"',
                  'PIP_FIND_LINKS="$WHEELHOUSE" uvx briefcase create macOS':'PIP_NO_INDEX=1 uvx --with pip==26.2.2 --from briefcase==0.3.25 briefcase create macOS --no-input --config \'template_branch="10d36c8512e92d3ee4b3be2579a47300ac8f844d"\' --config "template=\\"${BRIEFCASE_HOME}/qa-template-10d36c8512e92d3ee4b3be2579a47300ac8f844d\\""',
                  'python3 scripts/bundle_provenance_stages.py start':'cd "$REPO" && python3 "$RUNNER_TEMP/assembly-qa.py" trusted-start',
                  '  COLLECT_PROVENANCE_CONTEXT="$(python3 scripts/bundle_provenance_stages.py prepare-public-inputs)"':'  [[ "$COLLECT_INITIAL_CONTEXT_FD" =~ ^[0-9]+$ ]] || exit 1\n  eval "exec ${COLLECT_INITIAL_CONTEXT_FD}>&-"\n  ( cd "$REPO" && python3 "$RUNNER_TEMP/assembly-qa.py" wait-startup )\n  COLLECT_PROVENANCE_CONTEXT="$(python3 scripts/bundle_provenance_stages.py prepare-public-inputs)"',
                  'python3 scripts/bundle_provenance_stages.py controlled-install-and-bind':'cd "$REPO" && python3 "$RUNNER_TEMP/assembly-qa.py" dispatch-compiler',
                  '  COLLECT_PROVENANCE_CONTEXT="$(python3 scripts/bundle_provenance_stages.py controlled-build)"':'  ( cd "$REPO" && python3 "$RUNNER_TEMP/assembly-qa.py" presign )\n  COLLECT_PROVENANCE_CONTEXT="$(python3 scripts/bundle_provenance_stages.py controlled-build)"',
                  '  python3 scripts/bundle_provenance_stages.py emit-completion --fd "$COLLECT_PROVENANCE_COMPLETION_FD"':'  COLLECT_PROVENANCE_CONTEXT="$(cd "$REPO" && python3 "$RUNNER_TEMP/assembly-qa.py" finish)"\n  python3 scripts/bundle_provenance_stages.py emit-completion --fd "$COLLECT_PROVENANCE_COMPLETION_FD"',
              }
              for before,after in replacements.items():
                  assert text.count(before)==1, ('Literal recipe drift',before)
                  text=text.replace(before,after)
              result=text.encode()
              assert sha(result)==REVIEWED_ADAPTED_BUILD_SHA256, 'Adapted build drift'
              return result


          def validate_request(request):
              s=stages_module()
              assert set(request)=={'workspace','app','source_files','lock','recipe','recipe_sha256','archives','catalog_sha256','architecture','tools','markers'}
              assert request['workspace']==str(ROOT) and request['app']==str(APP) and request['architecture']=='arm64'
              raw=s.read(request['recipe']);assert sha(raw)==request['recipe_sha256']
              recipe=s._json(raw)
              assert recipe['compiler_baseline']=={'schema':2,'profile':'cloud-xcode16.4-arm64-v1','source':str(ROOT/'packages/menubar/scripts/cli_launcher.c')}
              assert recipe['compiler_producer']['workflow']['path']==str(ROOT/'.github/workflows/macos.yml')
              assert recipe['compiler_producer']['workflow']['sha256']==sha((ROOT/'.github/workflows/macos.yml').read_bytes())
              assert recipe['operation_cwd']=='packages/menubar'
              assert recipe['build_argv'][1:]==['build','macOS']
              tools=tuple(s.ToolIdentity(**v) for v in request['tools'])
              s.compiler.assert_profile_tools(s.compiler.CLOUD,tools,recipe)
              assert recipe['build_argv'][0] in {t.path for t in tools}, 'Actual Briefcase entry missing from I.tools'
              assert Path(recipe['compiler_producer']['python']['path']).is_absolute()
              assert set(request['source_files'])=={str(ROOT/row[0]) for row in REVIEWED_PRODUCT_ROWS}|{str(ROOT/'.github/workflows/macos.yml')}
              return recipe


          def trusted_start():
              s=stages_module();private=Path(os.environ['COLLECT_PROVENANCE_REQUEST']).parent
