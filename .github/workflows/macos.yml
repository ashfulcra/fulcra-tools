name: Collect app assembly QA
on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha256:
        description: Exact workflow SHA256 independently retained by root
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: collect-app-assembly-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      COLLECT_EXPECTED_WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
      UV_PYTHON: 3.13.14
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: '0.11.33'
          enable-cache: false
      - name: Pin actual Python and empty-state paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          uv python install 3.13.14
          PY313="$(uv python find 3.13.14)"
          mkdir -p "$RUNNER_TEMP/python313-bin" "$RUNNER_TEMP/assembly-evidence" "$RUNNER_TEMP/empty-collect-profile" "$RUNNER_TEMP/briefcase"
          ln -s "$PY313" "$RUNNER_TEMP/python313-bin/python3"
          echo "$RUNNER_TEMP/python313-bin" >> "$GITHUB_PATH"
          echo "FULCRA_COLLECT_HOME=$RUNNER_TEMP/empty-collect-profile" >> "$GITHUB_ENV"
          echo "BRIEFCASE_HOME=$RUNNER_TEMP/briefcase" >> "$GITHUB_ENV"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/assembly-evidence/runtime-constraints.txt" >> "$GITHUB_ENV"
          echo "UV_BUILD_CONSTRAINT=$RUNNER_TEMP/assembly-evidence/build-constraints.txt" >> "$GITHUB_ENV"
          "$PY313" -c 'import sys; assert sys.version_info[:3] == (3,13,14)'
          uv --version > "$RUNNER_TEMP/assembly-evidence/uv-version.txt"
          sw_vers > "$RUNNER_TEMP/assembly-evidence/macos-version.txt"
          xcodebuild -version > "$RUNNER_TEMP/assembly-evidence/xcode-version.txt"
      - name: Materialize QA-only checks and literal adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:3] == (3,13,14)'
          cat > "$RUNNER_TEMP/assembly-qa.py" <<'PY'
          """CI-only evidence checks. Source preparation: never executed locally."""
          from pathlib import Path
          import difflib, hashlib, importlib.metadata as md, json, os, re, subprocess, sys, tomllib, zipfile

          ROOT = Path.cwd()
          OUT = Path(os.environ['RUNNER_TEMP']) / 'assembly-evidence'
          APP = ROOT / 'packages/menubar/build/fulcra-menubar/macos/app/Fulcra Collect.app'
          def sha(b): return hashlib.sha256(b).hexdigest()
          def save(name, data):
              OUT.mkdir(exist_ok=True)
              (OUT/name).write_text(json.dumps(data, indent=2, sort_keys=True)+'\n')
          def git(*args): return subprocess.check_output(['git', *args])
          def norm(s): return re.sub(r'[-_.]+', '-', s).lower()
          def manifest(base):
              result = []
              for p in sorted(base.rglob('*')):
                  if p.is_symlink(): result.append([str(p.relative_to(base)), 'symlink', str(p.readlink())])
                  elif p.is_file(): result.append([str(p.relative_to(base)), oct(p.stat().st_mode & 0o777), p.stat().st_size, sha(p.read_bytes())])
              return result
          def declared_local_version(package):
              import ast
              source=package.get('source',{})
              assert set(source)=={'editable'} and isinstance(source['editable'],str), ('MISSING_NONEDITABLE_VERSION',package['name'])
              def local_path(base, relative):
                  assert isinstance(relative,str) and relative
                  rel=Path(relative)
                  assert not rel.is_absolute() and '..' not in rel.parts, ('VERSION_PATH_ESCAPE',relative)
                  target=base/rel
                  assert target.resolve().is_relative_to(base.resolve()), ('VERSION_PATH_ESCAPE',relative)
                  current=base
                  for part in rel.parts:
                      current=current/part
                      assert not current.is_symlink(), ('VERSION_SYMLINK',relative)
                  return target
              project_root=local_path(ROOT,source['editable'])
              metadata=tomllib.loads(local_path(project_root,'pyproject.toml').read_text())
              project=metadata['project']
              assert norm(project['name'])==norm(package['name']) and project.get('dynamic')==['version'] and 'version' not in project, 'Unexpected version declaration'
              assert metadata['build-system']['build-backend']=='hatchling.build'
              declaration=metadata['tool']['hatch']['version']
              assert set(declaration)=={'path'}, 'Unsupported Hatch version source'
              version_file=local_path(project_root,declaration['path'])
              assert version_file.stat().st_size<=65536, 'Unexpected version source size'
              tree=ast.parse(version_file.read_text())
              stores=[node for node in ast.walk(tree)if isinstance(node,ast.Name)and node.id=='__version__' and isinstance(node.ctx,ast.Store)]
              assignments=[node for node in tree.body if isinstance(node,ast.Assign)and len(node.targets)==1 and isinstance(node.targets[0],ast.Name)and node.targets[0].id=='__version__']
              assert len(stores)==len(assignments)==1, 'Version must have one top-level assignment'
              value=assignments[0].value
              assert isinstance(value,ast.Constant) and isinstance(value.value,str) and re.fullmatch(r'[0-9]+(?:\.[0-9]+)*',value.value), 'Version must be a plain numeric string literal'
              return value.value

          def locked():
              result = {}
              for original in tomllib.loads(Path('uv.lock').read_text())['package']:
                  p=dict(original)
                  n = norm(p['name'])
                  if n in result: raise RuntimeError('Ambiguous lock version: '+n)
                  if 'version' not in p:p['version']=declared_local_version(p)
                  result[n] = p
              return result
          def constraint_text(lock):
              return '\n'.join(f"{p['name']}=={p['version']}" for p in lock.values())+'\n'
          def arm64_slice(data):
              import struct
              if data[:4] == b'\xca\xfe\xba\xbe':
                  count=struct.unpack_from('>I',data,4)[0]; assert 0<count<=16
                  choices=[]
                  for i in range(count):
                      cpu,sub,offset,size,align=struct.unpack_from('>5I',data,8+20*i)
                      assert offset+size<=len(data)
                      if cpu==0x100000c: choices.append(data[offset:offset+size])
                  assert len(choices)==1
                  return choices[0]
              return data

          def signing_form(data):
              """Ignore only signature command/blob and LINKEDIT signature-sized bounds."""
              import struct
              if data[:4]==b'\xca\xfe\xba\xbe':
                  count=struct.unpack_from('>I',data,4)[0];assert 0<count<=16
                  parts=[];seen=set()
                  for i in range(count):
                      cpu,sub,offset,length,align=struct.unpack_from('>5I',data,8+20*i)
                      assert offset+length<=len(data) and (cpu,sub) not in seen
                      seen.add((cpu,sub));part=signing_form(data[offset:offset+length])
                      parts.append(struct.pack('>3I',cpu,sub,len(part))+part)
                  return b'FAT-SIGNED-FORMS'+b''.join(parts)
              assert data[:4]==b'\xcf\xfa\xed\xfe', 'Unsupported Mach-O form; fail closed'
              header=list(struct.unpack_from('<8I',data)); assert header[1] in (0x100000c,0x1000007)
              count,size=header[4:6];assert count<=512 and 32+size<=len(data)
              pos=32; commands=[];signature=None;first_section=len(data)
              for _ in range(count):
                  cmd,n=struct.unpack_from('<2I',data,pos);assert n>=8 and pos+n<=32+size
                  item=bytearray(data[pos:pos+n])
                  if cmd==0x1d:
                      assert n==16 and signature is None
                      off,length=struct.unpack_from('<2I',item,8)
                      assert off+length==len(data) and off>=32+size
                      signature=(off,length)
                  else:
                      if cmd==0x19:
                          assert n>=72
                          sections=struct.unpack_from('<I',item,64)[0];assert n==72+80*sections
                          for k in range(sections):
                              offset=struct.unpack_from('<I',item,72+80*k+48)[0]
                              if offset: first_section=min(first_section,offset)
                          if bytes(item[8:24]).rstrip(b'\0')==b'__LINKEDIT':
                              # Only these two size fields cover signature growth.
                              item[32:40]=b'\0'*8;item[48:56]=b'\0'*8
                      commands.append(bytes(item))
                  pos+=n
              assert pos==32+size and 32+size<=first_section<=len(data)
              assert not any(data[pos:first_section]), 'Nonzero header padding'
              end=signature[0] if signature else len(data)
              assert first_section<=end
              header[4]=len(commands);header[5]=sum(map(len,commands))
              return struct.pack('<8I',*header)+b''.join(commands)+data[first_section:end]

          def payload_equal(before, after, phase):
              if before==after:return True
              if phase=='raw':return arm64_slice(before)==after
              if phase=='signed':
                  try:return signing_form(before)==signing_form(after)
                  except (AssertionError,ValueError,IndexError):return False
              return False

          def required_inputs(archives, selected, consumed):
              assert set(selected)=={'support','stub'} and set(consumed)==set(selected)
              for role,name in selected.items():
                  assert name in archives and archives[name]==consumed[role], ('MISSING_OR_UNBOUND_INPUT',role,name)

          def verify_inventory(expected, actual):
              assert set(expected)==set(actual), ('INVENTORY_SET_DRIFT',sorted(set(expected)^set(actual)))
              for name,value in expected.items():assert actual[name]==value, ('PAYLOAD_DRIFT',name)

          def wheel_target(member):
              parts=member.split('/');assert parts and '..' not in parts and not member.startswith('/')
              if parts[0].endswith('.data'):
                  assert len(parts)>=3 and parts[1] in ('purelib','platlib','data','scripts','headers'), ('UNKNOWN_WHEEL_SCHEME',member)
                  assert parts[1] in ('purelib','platlib','data','scripts'), 'Header relocation unsupported; fail closed'
                  return '/'.join((['bin'] if parts[1]=='scripts' else [])+parts[2:])
              return member

          def require_metadata(expected, actual):
              assert set(expected)==set(actual), 'Missing or unexpected distribution metadata'
              for name,(version,files) in expected.items():
                  assert actual[name][0]==version
                  verify_inventory(files,actual[name][1])

          def deleted_by_sanitizer(name):
              p=Path(name)
              return 'tests' in p.parts or '__pycache__' in p.parts or p.suffix in ('.pyc','.pyo') or p.parts[0] in ('bin','PyObjCTest','pytest','_pytest','.pytest_cache') or name.startswith('pyarrow/_pyarrow_cpp_tests.') or p.parts[0].startswith(('pytest-','pytest_mock-')) and p.parts[0].endswith('.dist-info')

          def bind_required_debug_origins(expected_aliases,wheelhouse):
              """Require the fixed whole origin and consumed slice before ordinary checks."""
              import io,stat,time
              s=stages_module();n=s.native_proof
              selected=n.requirements_from_expected_aliases(expected_aliases)
              origins=tuple(o for o in n._DEBUG_DATA_ORIGINS if o.requirement in selected)
              if not origins:return
              names={o.requirement.archive_name for o in origins}
              assert len(names)==1, 'REQUIRED_DEBUG_ARCHIVE_AMBIGUOUS'
              archive=wheelhouse/next(iter(names));raw=s.read(archive,s.core.MAX_ARCHIVE_BYTES)
              assert all(len(raw)==o.archive_bytes and sha(raw)==o.requirement.archive_sha256 for o in origins), 'REQUIRED_DEBUG_ARCHIVE'
              deadline=time.monotonic()+s.core.SCAN_SECONDS;total=0
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  infos=z.infolist();assert len(infos)<=s.core.MAX_ZIP_ENTRIES
                  for origin in origins:
                      r=origin.requirement;matches=[info for info in infos if info.filename==r.member]
                      assert len(matches)==1, 'REQUIRED_DEBUG_MEMBER_MISSING_OR_DUPLICATE'
                      info=matches[0];mode=info.external_attr>>16
                      assert info.create_system==3 and stat.S_ISREG(mode) and stat.S_IMODE(mode)==r.mode and not info.is_dir(), 'REQUIRED_DEBUG_MEMBER_TYPE'
                      total+=info.file_size
                      assert info.file_size==origin.member_bytes<=s.core.MAX_MEMBER_BYTES and total<=s.core.MAX_MEMBER_TOTAL
                      assert time.monotonic()<deadline
                      with z.open(info) as stream:full=stream.read(origin.member_bytes+1)
                      assert len(full)==origin.member_bytes and sha(full)==origin.member_sha256, 'REQUIRED_DEBUG_FULL_ORIGIN'
                      assert 0<=origin.slice_offset and origin.slice_offset+r.bytes<=len(full)
                      data=full[origin.slice_offset:origin.slice_offset+r.bytes]
                      assert n.classify_signing_input(expected_aliases,r.path,data,r.mode)=='exact-linker-data'
                      target=APP/r.path;before=target.stat(follow_symlinks=False)
                      assert stat.S_ISREG(before.st_mode) and stat.S_IMODE(before.st_mode)==r.mode and before.st_size==r.bytes
                      current=s.read(target,s.core.MAX_FILE_BYTES)
                      assert s.compiler.identity(before)==s.compiler.identity(target.stat(follow_symlinks=False))
                      assert n.classify_signing_input(expected_aliases,r.path,current,stat.S_IMODE(before.st_mode))=='exact-linker-data'
                      assert current==data and time.monotonic()<deadline, 'REQUIRED_DEBUG_NOT_CONSUMED'


          def check_raw_bundle(expected_aliases):
              bind_required_debug_origins(expected_aliases,Path('wheelhouse'))
              pkgs=APP/'Contents/Resources/app_packages';expected={};expected_meta={}
              for w in sorted(Path('wheelhouse').glob('*.whl')):
                  with zipfile.ZipFile(w) as z:
                      metadata=next(n for n in z.namelist()if n.endswith('.dist-info/METADATA'))
                      text=z.read(metadata).decode();name=norm(re.search(r'^Name: (.+)$',text,re.M)[1]);version=re.search(r'^Version: (.+)$',text,re.M)[1]
                      assert name in locked() and locked()[name]['version']==version
                      meta={}
                      for member in z.namelist():
                          if member.endswith('/'):continue
                          dest=wheel_target(member)
                          if deleted_by_sanitizer(dest):continue
                          if '.dist-info/' in dest:
                              leaf=dest.split('/',1)[1]
                              if leaf in ('RECORD','INSTALLER'):continue
                              meta[leaf]=z.read(member)
                          assert dest not in expected or expected[dest]==z.read(member), ('WHEEL_COLLISION',dest)
                          expected[dest]=z.read(member)
                      if not deleted_by_sanitizer(metadata):expected_meta[name]=(version,meta)
              for name,data in expected.items():
                  if name.endswith(('.dist-info/RECORD','.dist-info/INSTALLER')):continue
                  target=pkgs/name;assert target.is_file() and not target.is_symlink(), ('MISSING_WHEEL_PAYLOAD',name)
                  assert payload_equal(data,target.read_bytes(),'raw'), ('RAW_WHEEL_DRIFT',name)
              actual_files={str(p.relative_to(pkgs))for p in pkgs.rglob('*')if p.is_file()}
              generated={n for n in actual_files if '.dist-info/' in n and n.split('/',1)[1] in ('RECORD','INSTALLER','REQUESTED','direct_url.json')}
              assert actual_files-generated==set(expected), ('UNEXPECTED_OR_MISSING_WHEEL_FILES',sorted((actual_files-generated)^set(expected)))
              actual_meta={}
              for d in md.distributions(path=[str(pkgs)]):
                  base=Path(d._path);files={str(p.relative_to(base)):p.read_bytes()for p in base.rglob('*')if p.is_file() and str(p.relative_to(base)) not in ('RECORD','INSTALLER','REQUESTED','direct_url.json')}
                  # pip-generated metadata are explicit, validated separately rather than exempting directory.
                  assert (base/'RECORD').is_file() and (base/'INSTALLER').read_text().strip()=='pip'
                  if (base/'REQUESTED').exists():assert (base/'REQUESTED').read_bytes()==b''
                  if (base/'direct_url.json').exists():
                      direct=json.loads((base/'direct_url.json').read_text());assert direct.get('url','').startswith('file:')
                  actual_meta[norm(d.metadata['Name'])]=(d.version,files)
              require_metadata(expected_meta,actual_meta)
              prefix='packages/menubar/fulcra_menubar/'
              names=git('ls-tree','-r','--name-only','HEAD','--',prefix).decode().splitlines()
              source={n[len(prefix):]:git('show','HEAD:'+n)for n in names}
              app_source=APP/'Contents/Resources/app/fulcra_menubar'
              actual={str(p.relative_to(app_source)):p.read_bytes()for p in app_source.rglob('*')if p.is_file()}
              verify_inventory(source,actual)
              save('raw-wheel-source-verification.json',{'expected_files':sorted(expected),'source_assets':sorted(source),'distributions':sorted(expected_meta),'allowed_transform':'create: fat universal Mach-O => exact arm64 slice only'})

          def snapshot_signing(expected_aliases):
              s=stages_module();n=s.native_proof
              required=n.require_linker_data_inventory(expected_aliases,s.inventory(APP))
              state={}
              for p in APP.rglob('*'):
                  rel=str(p.relative_to(APP))
                  if p.is_symlink():state[rel]={'link':str(p.readlink())};continue
                  if not p.is_file():continue
                  before=p.stat(follow_symlinks=False);data=s.read(p,s.core.MAX_FILE_BYTES)
                  assert s.compiler.identity(before)==s.compiler.identity(p.stat(follow_symlinks=False))
                  entry={'sha256':sha(data),'mode':before.st_mode&0o777}
                  classification=n.classify_signing_input(expected_aliases,rel,data,entry['mode'])
                  if classification=='ordinary' and arm64_slice(data)[:4]==b'\xcf\xfa\xed\xfe':
                      selected=json.loads((OUT/'selected-inputs.json').read_text())
                      signing_data=arm64_slice(data) if rel==selected['stub_installed'] else data
                      entry['signing_form']=sha(signing_form(signing_data))
                  state[rel]=entry
              assert all(state.get(r.path)=={'sha256':r.sha256,'mode':r.mode} for r in required), 'REQUIRED_DATA_SNAPSHOT'
              return state

          def check_signed_bundle(expected_aliases):
              before=json.loads((OUT/'presign-manifest.json').read_text());after=snapshot_signing(expected_aliases)
              stub=json.loads((OUT/'selected-inputs.json').read_text())['stub_installed']
              renamed='Contents/MacOS/Fulcra Collect'
              if stub!=renamed:assert renamed not in before;before[renamed]=before.pop(stub)
              for name,entry in before.items():
                  if name.endswith('/_CodeSignature/CodeResources'):continue
                  assert name in after, ('SIGNED_MISSING',name)
                  if entry==after[name]:continue
                  assert 'signing_form' in entry and entry.get('signing_form')==after[name].get('signing_form') and entry.get('mode')==after[name].get('mode'), ('UNACCOUNTED_SIGNING_CHANGE',name)
              for name in set(after)-set(before):assert name.endswith('/_CodeSignature/CodeResources'), ('SIGNED_EXTRA',name)
              save('signing-transformations.json',{'changed':[n for n in before if before[n]!=after.get(n)],'added':sorted(set(after)-set(before)),'stub_rename':[stub,renamed],'rule':'arm64 slice plus only LC_CODE_SIGNATURE/signature blob and __LINKEDIT size fields; unchanged bytes exact'})
              save('bundle-manifest.json',manifest(APP))

          def verify_template_identity(record, expected_path):
              assert record['path']==expected_path and record['regular_checkout'] is True, 'TEMPLATE_PATH_UNBOUND'
              assert record['origin']=='https://github.com/beeware/briefcase-macOS-app-template.git', 'TEMPLATE_ORIGIN_DRIFT'
              assert record['status']=='', 'TEMPLATE_CHECKOUT_DIRTY'
              assert record['head']=='10d36c8512e92d3ee4b3be2579a47300ac8f844d', 'TEMPLATE_HEAD_DRIFT'
              assert record['briefcase_toml_sha256']=='bc848e807e203269e22d6c4616344f2a0bf3433b195114206b087d393221dc61', 'TEMPLATE_SOURCE_DRIFT'

          def verify_selected_template():
              folder=Path(os.environ['BRIEFCASE_HOME'])/'qa-template-10d36c8512e92d3ee4b3be2579a47300ac8f844d'
              assert folder.is_absolute() and folder.resolve()==folder and folder.is_dir(), 'TEMPLATE_PATH_INVALID'
              assert (folder/'.git').is_dir() and not any(p.is_symlink()for p in folder.rglob('*')), 'TEMPLATE_SYMLINK_OR_NONCHECKOUT'
              def query(*args):
                  return subprocess.check_output(['git','-c','core.hooksPath=/dev/null','-C',str(folder),*args]).decode().strip()
              template=folder/'{{ cookiecutter.format }}'/'briefcase.toml'
              assert template.is_file() and (folder/'cookiecutter.json').is_file(), 'TEMPLATE_SOURCE_MISSING'
              record={'path':str(folder),'origin':query('remote','get-url','origin'),'head':query('rev-parse','HEAD'),'briefcase_toml_sha256':sha(template.read_bytes()),'status':query('status','--porcelain=v1','--untracked-files=all'),'regular_checkout':True}
              verify_template_identity(record,str(folder))
              return record

          def bind_required_linker_support(expected,archive_path):
              """Bind the one required source member before the general config skip."""
              import io,stat,tarfile,time
              s=stages_module();n=s.native_proof
              records=tuple(r for r in n.requirements_from_expected_aliases(expected.policy.aliases)
                  if r not in tuple(o.requirement for o in n._DEBUG_DATA_ORIGINS))
              if not records:return
              assert expected.app==APP
              raw=s.read(archive_path,s.core.MAX_ARCHIVE_BYTES)
              assert all(archive_path.name==r.archive_name and sha(raw)==r.archive_sha256 for r in records), 'REQUIRED_SUPPORT_ORIGIN'
              deadline=time.monotonic()+s.core.SCAN_SECONDS
              found={};count=0;total=0;wanted={r.member:r for r in records}
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tar:
                  for member in tar:
                      count+=1;total+=member.size
                      assert count<=s.core.MAX_ZIP_ENTRIES and total<=s.core.MAX_MEMBER_TOTAL and time.monotonic()<deadline
                      if member.name not in wanted:continue
                      r=wanted[member.name]
                      assert member.name not in found and member.isfile() and member.mode==r.mode and member.size==r.bytes, 'REQUIRED_SUPPORT_MEMBER_TYPE'
                      with tar.extractfile(member) as stream:origin=stream.read(r.bytes+1)
                      assert n.classify_signing_input(expected.policy.aliases,r.path,origin,member.mode)=='exact-linker-data'
                      target=APP/r.path;before=target.stat(follow_symlinks=False)
                      assert stat.S_ISREG(before.st_mode) and stat.S_IMODE(before.st_mode)==r.mode and before.st_size==r.bytes
                      current=s.read(target,s.core.MAX_FILE_BYTES)
                      assert s.compiler.identity(before)==s.compiler.identity(target.stat(follow_symlinks=False))
                      assert n.classify_signing_input(expected.policy.aliases,r.path,current,stat.S_IMODE(before.st_mode))=='exact-linker-data'
                      assert current==origin and time.monotonic()<deadline
                      found[member.name]=r.path
              assert set(found)==set(wanted) and time.monotonic()<deadline, 'REQUIRED_SUPPORT_MEMBER_MISSING'


          def bind_selected_inputs():
              import tarfile
              selected={'support':'Python-3.13-macOS-support.b10.tar.gz','stub':'GUI-Stub-3.13-b12.zip'}
              root=APP.parent;config=tomllib.loads((root/'briefcase.toml').read_text())['paths']
              assert config['support_revision']==10 and config['stub_binary_revision']==12 and config['runtime_path']=='Python.xcframework/macos-arm64_x86_64/Python.framework'
              caches=[Path(os.environ['BRIEFCASE_HOME']),Path.home()/'Library/Caches/org.beeware.briefcase',Path.home()/'.cache/briefcase']
              save('template-source-provenance.json',verify_selected_template())
              archives={};paths={}
              for role,name in selected.items():
                  matches=[p for c in caches if c.exists()for p in c.rglob(name)if p.is_file()]
                  assert len(matches)==1, ('SELECTED_INPUT_MISSING_OR_AMBIGUOUS',role,name)
                  paths[role]=matches[0];archives[name]=matches[0].read_bytes()
              # Bind stub bytes to its exact unpacked pre-build location, no arbitrary cache match.
              with zipfile.ZipFile(paths['stub'])as z:
                  members=[m for m in z.namelist()if not m.endswith('/')];assert len(members)==1
                  m=members[0];assert Path(m).name==m
                  installed=APP/'Contents/MacOS'/m
